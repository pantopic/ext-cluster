syntax = "proto3";

package pb;

option go_package = "github.com/pantopic/ext-cluster/sdk-go/pb";

message Namespace {
  string name = 1;
  uint64 version = 2;
  uint64 created = 3;
  uint64 updated = 4;
  uint64 deleted = 5;
  map<string, string> tags = 6;
}

message Cluster {
  string name = 1;
  uint64 version = 2;
  uint64 created = 3;
  uint64 updated = 4;
  uint64 deleted = 5;
  map<string, string> tags = 6;
}

message Resource {
  string namespace = 1;
  string name = 2;
  uint64 version = 3;
  uint64 created = 4;
  uint64 updated = 5;
  uint64 deleted = 6;
  map<string, string> tags = 7;
  string type = 8;
  string status = 9;
}

message Service {
  string namespace = 1;
  string resource = 2;
  string name = 3;
  uint64 version = 4;
  uint64 created = 5;
  uint64 updated = 6;
  uint64 deleted = 7;
  map<string, string> tags = 8;
  string type = 9;
  string status = 10;
  uint64 port = 11;
}

message Component {
  string namespace = 1;
  string resource = 2;
  string cluster = 3;
  string name = 4;
  uint64 version = 5;
  uint64 created = 6;
  uint64 updated = 7;
  uint64 deleted = 8;
  map<string, string> tags = 9;
  string type = 10;
  string status = 11;
}

message Host {
  string id = 1;
  uint64 created = 2;
  uint64 updated = 3;
  string api_address = 4;
  string raft_address = 5;
  map<string, string> tags = 6;
  repeated string shard_types = 7;
  string status = 8;
}

message Shard {
  uint64 id = 1;
  uint64 created = 2;
  uint64 updated = 3;
  uint64 leader = 4;
  string name = 5;
  uint64 term = 6;
  map<string, string> tags = 7;
  string type = 8;
  string status = 9;
}

message Replica {
  uint64 id = 1;
  uint64 created = 2;
  uint64 updated = 3;
  string host_id = 4;
  bool is_non_voting = 5;
  bool is_witness = 6;
  uint64 shard_id = 7;
  map<string, string> tags = 8;
  string status = 9;
}
